version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:17-alpine
    container_name: virtual-clinic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtual_clinic}
      POSTGRES_USER: ${POSTGRES_USER:-virtual_clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-virtual_clinic} -d ${POSTGRES_DB:-virtual_clinic}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - virtual-clinic-network

  # Aplicación backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virtual-clinic-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-virtual_clinic}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-virtual_clinic}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      SQL_ECHO: "false"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-domain.com}
      PDF_FOOTER_LEGEND: ${PDF_FOOTER_LEGEND:-"Indicacion medica"}
      STORAGE_DIR: /app/storage
      MAX_FILE_SIZE_MB: 10
      PATIENT_VISIBLE_NOTES: "false"
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
    volumes:
      - storage_data:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - virtual-clinic-network

  # Redis para rate limiting y sesiones
  redis:
    image: redis:7-alpine
    container_name: virtual-clinic-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - virtual-clinic-network

  # Proxy reverso (Nginx) - opcional, para SSL termination
  # Descomentar y configurar certificados para usar en producción
  # nginx:
  #   image: nginx:alpine
  #   container_name: virtual-clinic-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - api
  #   networks:
  #     - virtual-clinic-network

volumes:
  db_data:
  storage_data:
  redis_data:

networks:
  virtual-clinic-network:
    driver: bridge