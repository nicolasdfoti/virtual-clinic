# Solo para desarrollo. Levanta PostgreSQL y pgAdmin; el backend y el frontend
# se corren en el host (ver README).
#
#   docker compose up -d      levantar
#   docker compose down       parar (conserva el volumen)
#   docker compose down -v    parar y BORRAR el volumen
#
# Las variables salen del `.env` de la raiz y no tienen defaults: si falta ese
# archivo, compose falla en vez de arrancar Postgres con credenciales al azar.

services:
  postgres:
    image: postgres:17-alpine
    container_name: virtual-clinic-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en el .env de la raiz}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en el .env de la raiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el .env de la raiz}

    # Solo escucha en localhost: la base no queda alcanzable desde la red.
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: virtual-clinic-pgadmin
    restart: unless-stopped

    environment:
      # Sin default: compose falla si no estan en el .env, en lugar de dejar
      # la interfaz con credenciales conocidas.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?falta PGADMIN_EMAIL en el .env de la raiz}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?falta PGADMIN_PASSWORD en el .env de la raiz}
      PGADMIN_CONFIG_SERVER_MODE: "False"

    # Bindear a localhost: pgAdmin no debe quedar expuesto en la red.
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: